[workspace]
authors = ["Guilherme Leobas <gleobas@quansight.com>"]
channels = ["conda-forge"]
name = "dynamo-skips-app"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
test-runner = "python cpython_test_runner.py"
test-runner-reuse = "python cpython_test_runner.py --reuse-output data/all_tests_output_*.txt"
build-site = "python build_site.py"
serve = { cmd = "python -m http.server 8000 --directory site", depends-on = ["build-site"] }

[dependencies]
python = ">=3.14.3,<3.15"
